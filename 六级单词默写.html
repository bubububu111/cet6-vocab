<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六级单词默写本</title>
    <style>
        *{box-sizing:border-box;font-family:system-ui}
        body{max-width:780px;margin:0 auto;padding:16px;background:#121826;color:#fff;min-height:100vh}
        h2{margin:12px 0 4px}
        h4{margin:0}
        .sub{color:#9ca3af;font-size:13px;margin:2px 0 12px}
        .tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
        .tab{background:#1f2937;border:1px solid #374151;color:#e5e7eb;padding:10px 16px;border-radius:10px;cursor:pointer;font-size:15px}
        .tab.on{background:#2563eb;border-color:#2563eb;color:#fff}
        .box{background:#1f2937;padding:16px;border-radius:12px;margin-bottom:14px}
        textarea,input[type=text]{width:100%;padding:12px;border-radius:8px;border:none;font-size:16px;margin:8px 0;background:#111827;color:#fff}
        button{padding:9px 14px;border:none;border-radius:8px;margin:4px;cursor:pointer;font-size:14px;color:#fff;background:#374151}
        .btn-blue{background:#2563eb}
        .btn-green{background:#10b981}
        .btn-red{background:#ef4444}
        .btn-gray{background:#374151}
        .tool-row{display:flex;flex-wrap:wrap;gap:6px}
        .stats-row{display:flex;flex-wrap:wrap;gap:10px}
        .stat{background:#111827;border:1px solid #374151;border-radius:10px;padding:10px 14px;text-align:center;flex:1;min-width:90px}
        .stat b{display:block;font-size:22px}
        .stat span{font-size:12px;color:#9ca3af}
        .word-card{padding:26px;text-align:center;font-size:26px;background:#374151;border-radius:12px;margin:14px 0;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:8px}
        .ph{font-size:14px;color:#93c5fd}
        .pos-tag{font-size:13px;color:#fbbf24;background:#1e293b;border:1px solid #78350f;border-radius:6px;padding:1px 7px;display:inline-block}
        .result{font-size:17px;margin-top:10px;min-height:26px}
        .right{color:#34d399}
        .wrong{color:#f87171}
        .quiz-opt{display:block;width:100%;text-align:left;background:#111827;border:1px solid #374151;padding:12px 14px;border-radius:10px;margin:6px 0;font-size:16px;cursor:pointer;color:#fff}
        .quiz-opt:hover{border-color:#2563eb}
        .quiz-opt:disabled{cursor:default}
        .quiz-ok{background:#10b981!important;border-color:#10b981!important}
        .quiz-no{background:#ef4444!important;border-color:#ef4444!important}
        .sync-box{background:#111827;border:1px solid #374151;border-radius:12px;padding:14px;margin:12px 0;font-size:15px;line-height:1.8}
        .sync-box h4{margin:0 0 8px;color:#93c5fd}
        .cls-card{background:#111827;border:1px solid #374151;border-radius:10px;padding:12px;margin-bottom:10px}
        .cls-tags{font-size:14px;color:#93c5fd;margin-bottom:8px}
        .cls-chip{background:#1e3a8a;color:#fff;border:none;border-radius:999px;padding:6px 14px;margin:4px;cursor:pointer;font-size:14px}
        .cls-chip:hover{background:#2563eb}
        .cls-chip-on{background:#10b981}
        .cls-body{margin-top:8px}
        .cls-word{padding:8px 12px;border-bottom:1px solid #374151;font-size:15px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
        .cls-word:last-child{border-bottom:none}
        .cls-cn{color:#9ca3af;font-size:13px}
        .bk-row{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid #2b3445;font-size:15px;cursor:pointer;flex-wrap:wrap}
        .bk-row:hover{background:#1d2636}
        .bk-en{font-weight:600;min-width:110px}
        .bk-pos{color:#fbbf24;font-size:12px;background:#1e293b;border:1px solid #374151;border-radius:6px;padding:1px 7px;min-width:36px;text-align:center}
        .bk-ph{color:#93c5fd;font-size:12px;min-width:90px}
        .bk-cn{flex:1;color:#d1d5db;min-width:120px}
        .bk-level{font-size:12px;padding:2px 8px;border-radius:999px}
        .lv0{background:#ef4444;color:#fff}
        .lv1{background:#f59e0b;color:#fff}
        .lv2{background:#10b981;color:#fff}
        .heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0 6px}
        .day{aspect-ratio:1;border-radius:6px;background:#1d2636;display:flex;align-items:center;justify-content:center;font-size:11px;color:#6b7280}
        .day.d0{background:#3b82f6}
        .day.d1{background:#f59e0b}
        .day.d2{background:#ef4444}
        .day.d3{background:#10b981}
        .bar{display:flex;height:24px;border-radius:999px;overflow:hidden;margin:10px 0;background:#1d2636}
        .bar div{display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;min-width:0}
        .none{color:#9ca3af;text-align:center;padding:20px}
    </style>
</head>
<body>
    <h2>📖 六级单词默写系统</h2>
    <p class="sub" id="todayLine">今日：还没开始练习，加油！</p>

    <div class="tabs">
        <button class="tab on" data-view="practice" onclick="showView('practice')">✏️ 默写练习</button>
        <button class="tab" data-view="book" onclick="showView('book')">📒 单词本</button>
        <button class="tab" data-view="stats" onclick="showView('stats')">📊 学习统计</button>
        <button class="tab" data-view="cls" onclick="showView('cls')">📚 词义分类</button>
    </div>

    <!-- 默写练习 -->
    <div id="view-practice">
        <div class="box tool-row">
            <button class="btn-green" onclick="switchMode(0)">看英文 → 默写中文</button>
            <button class="btn-green" onclick="switchMode(1)">看中文 → 默写英文</button>
            <button id="quizBtn" onclick="toggleQuiz()">📝 选择题模式：关</button>
        </div>
        <div class="box tool-row">
            <button class="btn-blue" onclick="pickAll()">全部随机默写</button>
            <button onclick="pickWrong()">只默写错题</button>
            <button onclick="pickWeak()">未掌握优先</button>
        </div>
        <div class="word-card" id="showWord" onclick="toggleSync()">点击开始默写（点卡片看同义词）</div>
        <div class="sync-box" id="syncBox" style="display:none"></div>
        <input type="text" id="answerInput" placeholder="在这里输入你的答案，回车提交" onkeydown="if(event.key==='Enter')checkAnswer()">
        <div id="quizBox"></div>
        <div class="tool-row">
            <button class="btn-blue" onclick="checkAnswer()">提交答案</button>
            <button onclick="nextWord()">下一个</button>
            <button onclick="toggleSync()">🔗 同义词</button>
            <button onclick="speakWord()">🔊 朗读</button>
        </div>
        <div class="result" id="resultText"></div>
    </div>

    <!-- 单词本 -->
    <div id="view-book" style="display:none">
        <div class="box">
            <h4 style="margin-bottom:6px">📥 词库管理</h4>
            <div class="tool-row">
                <button class="btn-blue" onclick="loadPreset()">📦 载入内置六级词库</button>
                <button onclick="exportWords()">💾 导出备份</button>
                <button onclick="document.getElementById('fileInput').click()">📂 导入备份文件</button>
                <input type="file" id="fileInput" accept=".txt,.csv" style="display:none" onchange="importFile(this)">
                <button class="btn-red" onclick="clearAll()">🗑️ 清空词库</button>
            </div>
            <textarea id="wordInput" rows="5" placeholder="批量导入格式（一行一条，| 分隔）：&#10;英文|释义&#10;英文|释义|音标|例句|词性&#10;示例：&#10;abandon|放弃；抛弃|əˈbændən|He abandoned the plan.|v.&#10;fossil|化石|ˈfɒsl|This is a fossil.|n."></textarea>
            <button class="btn-green" onclick="importWords()">导入单词库</button>
            <div class="sub" style="margin-top:8px">词性标注：n.名词 v.动词 adj.形容词 adv.副词 prep.介词 conj.连词 pron.代词 num.数词 phr.短语 · v./n. 表示兼类</div>
        </div>
        <div class="box">
            <h4 style="margin-bottom:6px">🔎 单词本（共 <span id="bkCount">0</span> 词）</h4>
            <input type="text" id="bkSearch" placeholder="搜索英文或释义…" oninput="renderBook()">
            <div id="bkList"></div>
        </div>
    </div>

    <!-- 学习统计 -->
    <div id="view-stats" style="display:none">
        <div class="box">
            <h4 style="margin-bottom:10px">📅 今日概览</h4>
            <div class="stats-row" id="statToday"></div>
        </div>
        <div class="box">
            <h4 style="margin-bottom:4px">🔥 连续打卡 <b id="streakNum">0</b> 天</h4>
            <div class="heat" id="heatMap"></div>
            <div class="sub">近 30 天 · 绿 ≥80% 正确率 · 蓝 ≥50% · 橙 ≥20% · 红 &lt;20% · 灰 未练习</div>
        </div>
        <div class="box">
            <h4 style="margin-bottom:6px">🎯 掌握度分布（共 <span id="lvCount">0</span> 词）</h4>
            <div class="bar" id="lvBar"></div>
            <div class="stats-row" id="lvLegend"></div>
        </div>
    </div>

    <!-- 词义分类 -->
    <div id="view-cls" style="display:none">
        <div class="box">
            <h4 style="margin-bottom:6px">📚 词义分类 <span id="clsCount"></span></h4>
            <div id="clsList"></div>
        </div>
    </div>

<script>

    {en:'vulnerable', cn:'脆弱的', pos:'adj.', ph:'ˈvʌlnərəbl', ex:'Old people are vulnerable to disease.'},
    {en:'welfare', cn:'福利', pos:'n.', ph:'ˈwelfeə', ex:'The state looks after people welfare.'},
    {en:'whereas', cn:'然而', pos:'conj.', ph:'ˌweərˈæz', ex:'He is rich, whereas I am poor.'},
    {en:'widespread', cn:'广泛的', pos:'adj.', ph:'ˈwaɪdspred', ex:'The disease is widespread.'},
    {en:'withstand', cn:'经受住', pos:'v.', ph:'wɪðˈstænd', ex:'The bridge can withstand strong winds.'},
    {en:'witness', cn:'目击者；见证', pos:'n./v.', ph:'ˈwɪtnəs', ex:'He witnessed the accident.'},
    {en:'yield', cn:'产出；屈服', pos:'v./n.', ph:'jiːld', ex:'The land yields rich crops.'}
];

// ================= 数据与状态 =================
const todayStrFrom = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayStr = () => todayStrFrom(new Date());
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function loadWords(){
    if(localStorage.getItem('cet6words') === null){
        return PRESET_WORDS.map(w => ({...w, wrong:false, level:0, streak:0}));
    }
    return (JSON.parse(localStorage.getItem('cet6words')) || []).map(w => ({
        en:w.en, cn:w.cn, pos:w.pos || '', ph:w.ph || '', ex:w.ex || '', wrong:!!w.wrong, level:w.level || 0, streak:w.streak || 0
    }));
}

let wordList = loadWords();
let nowIndex = 0;
let mode = 0; //0英→中，1中→英
let currentPool = [...wordList];
let currentWord = null;
let quizOn = false;

function saveData(){
    localStorage.setItem('cet6words', JSON.stringify(wordList));
}

function getStats(){ return JSON.parse(localStorage.getItem('cet6stats')) || []; }
function saveStats(s){ localStorage.setItem('cet6stats', JSON.stringify(s)); }
function getCheckin(){ return JSON.parse(localStorage.getItem('cet6checkin')) || []; }
function saveCheckin(c){ localStorage.setItem('cet6checkin', JSON.stringify(c)); }

// ================= 视图切换 =================
function showView(v){
    ['practice','book','stats','cls'].forEach(x => {
        document.getElementById('view-' + x).style.display = x === v ? 'block' : 'none';
    });
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.view === v));
    if(v === 'book') renderBook();
    if(v === 'stats') renderStatViews();
    if(v === 'cls') renderClusters();
}

// ================= 词库管理 =================
function parseLines(text){
    let added = 0;
    String(text).split(/\r?\n/).forEach(line => {
        if(!line.trim()) return;
        const [en, cn, ph, ex, pos] = line.split('|').map(s => s.trim());
        if(en && cn && !wordList.some(w => w.en === en)){
            wordList.push({en, cn, pos: pos || '', ph: ph || '', ex: ex || '', wrong:false, level:0, streak:0});
            added++;
        }
    });
    return added;
}

function importWords(){
    const added = parseLines(document.getElementById('wordInput').value);
    saveData();
    alert(`成功导入 ${added} 个新单词，当前词库共 ${wordList.length} 个！`);
    document.getElementById('wordInput').value = '';
    resetPool();
    refreshViews();
}

function importFile(input){
    const f = input.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = e => {
        const added = parseLines(e.target.result);
        saveData();
        alert(`备份导入完成，新增 ${added} 个单词！`);
        resetPool();
        refreshViews();
    };
    reader.readAsText(f, 'utf-8');
    input.value = '';
}

function loadPreset(){
    let added = 0, filled = 0;
    PRESET_WORDS.forEach(p => {
        const ex = wordList.find(w => w.en === p.en);
        if(ex){
            // 只补空字段，不覆盖用户自定义内容
            if(!ex.pos && p.pos){ ex.pos = p.pos; filled++; }
            if(!ex.ph && p.ph){ ex.ph = p.ph; filled++; }
            if(!ex.ex && p.ex){ ex.ex = p.ex; filled++; }
        }else{
            wordList.push({...p, wrong:false, level:0, streak:0});
            added++;
        }
    });
    saveData();
    alert(`内置词库载入完成，新增 ${added} 个单词，补齐 ${filled} 处词性/音标/例句，当前共 ${wordList.length} 个！`);
    resetPool();
    refreshViews();
}

function exportWords(){
    const text = wordList.map(w => [w.en, w.cn, w.ph || '', w.ex || '', w.pos || ''].join('|')).join('\n');
    const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '六级词库备份.txt';
    a.click();
    URL.revokeObjectURL(a.href);
}

function clearAll(){
    if(confirm('确定清空所有单词、错题和进度记录吗？')){
        wordList = [];
        currentPool = [];
        nowIndex = 0;
        currentWord = null;
        saveData();
        document.getElementById('showWord').innerHTML = '词库已清空，去「单词本」导入或载入内置词库';
        document.getElementById('resultText').innerText = '';
        document.getElementById('answerInput').value = '';
        document.getElementById('quizBox').innerHTML = '';
        document.getElementById('syncBox').style.display = 'none';
        refreshViews();
    }
}

function resetPool(){
    if(!wordList.length){
        currentPool = [];
        nowIndex = 0;
        document.getElementById('showWord').innerHTML = '先导入或载入单词，开始默写';
        return;
    }
    currentPool = [...wordList];
    shuffle(currentPool);
    nowIndex = 0;
    nextWord();
}

function refreshViews(){
    if(document.getElementById('view-book').style.display !== 'none') renderBook();
    if(document.getElementById('view-stats').style.display !== 'none') renderStatViews();
    if(document.getElementById('view-cls').style.display !== 'none') renderClusters();
    renderTodayLine();
}

// ================= 默写核心 =================
function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}

function switchMode(m){
    mode = m;
    alert(m === 0 ? '模式切换：看英文默写中文' : '模式切换：看中文默写英文');
    nextWord();
}

function pickAll(){
    currentPool = [...wordList];
    shuffle(currentPool);
    nowIndex = 0;
    nextWord();
}

function pickWrong(){
    currentPool = wordList.filter(w => w.wrong);
    if(!currentPool.length){ alert('暂无错题，继续保持！'); return; }
    shuffle(currentPool);
    nowIndex = 0;
    nextWord();
}

function pickWeak(){
    currentPool = wordList.filter(w => (w.level || 0) < 2);
    if(!currentPool.length){ alert('太棒了，所有单词都已掌握！'); return; }
    shuffle(currentPool);
    nowIndex = 0;
    nextWord();
}

function nextWord(){
    if(currentPool.length === 0){
        currentWord = null;
        document.getElementById('showWord').innerHTML = '✅ 本轮默写完成';
        document.getElementById('quizBox').innerHTML = '';
        return;
    }
    const w = currentPool[nowIndex];
    currentWord = w;
    const card = document.getElementById('showWord');
    // 看英文时显示音标+词性；看中文时只显示词性（避免音标剧透拼写）
    const sub = mode === 0 ? [w.ph, w.pos].filter(Boolean).join(' · ') : w.pos || '';
    card.innerHTML = esc(mode === 0 ? w.en : w.cn)
        + (sub ? `<div class="ph">${esc(sub)}</div>` : '');
    document.getElementById('answerInput').value = '';
    document.getElementById('resultText').innerText = '';
    document.getElementById('syncBox').style.display = 'none';
    if(quizOn) renderQuiz();
    nowIndex++;
    if(nowIndex >= currentPool.length) nowIndex = 0;
}

// 判题：去掉空格、标点，忽略大小写
function normalize(s){
    return String(s).toLowerCase().replace(/[^\w\u4e00-\u9fa5]/g, '');
}

function targetOf(w){ return mode === 0 ? w.cn : w.en; }

function checkAnswer(){
    if(quizOn) return;
    const w = currentWord;
    if(!w){ document.getElementById('resultText').innerText = '请先开始默写'; return; }
    const userAns = document.getElementById('answerInput').value.trim();
    const target = targetOf(w);
    const resDom = document.getElementById('resultText');
    if(normalize(userAns) === normalize(target)){
        resDom.className = 'result right';
        resDom.innerText = `✅ 正确！${w.en}${w.pos ? ' (' + w.pos + ')' : ''} —— ${w.cn}`;
        markRight(w);
        recordStat(true);
    }else{
        resDom.className = 'result wrong';
        resDom.innerText = `❌ 错啦！正确答案：${w.pos ? w.pos + ' ' : ''}${target}`;
        markWrong(w);
        recordStat(false);
    }
    saveData();
}

function markRight(w){
    w.wrong = false;
    w.streak = (w.streak || 0) + 1;
    if(w.streak >= 3) w.level = 2;
    else if(w.level < 2) w.level = 1;
}

function markWrong(w){
    w.wrong = true;
    w.streak = 0;
    w.level = 0;
}

// ================= 选择题模式 =================
function toggleQuiz(){
    quizOn = !quizOn;
    document.getElementById('quizBtn').innerText = '📝 选择题模式：' + (quizOn ? '开' : '关');
    document.getElementById('answerInput').style.display = quizOn ? 'none' : 'block';
    if(quizOn){ if(currentWord) renderQuiz(); }
    else document.getElementById('quizBox').innerHTML = '';
}

function renderQuiz(){
    const w = currentWord;
    if(!w) return;
    const dist = wordList.filter(x => x !== w);
    shuffle(dist);
    const options = [
        {t: targetOf(w), pos: mode === 0 ? w.pos : '', ok:true},
        ...dist.slice(0, 3).map(p => ({t: targetOf(p), pos: mode === 0 ? p.pos : '', ok:false}))
    ];
    shuffle(options);
    window._quizAnswer = options;
    document.getElementById('quizBox').innerHTML = options.map((o, i) =>
        `<button class="quiz-opt" id="qo-${i}" onclick="quizPick(${i})">${esc(o.pos ? o.pos + ' ' : '')}${esc(o.t)}</button>`).join('');
}

function quizPick(i){
    const opts = window._quizAnswer;
    const w = currentWord;
    if(!w) return;
    opts.forEach((o, j) => {
        const b = document.getElementById('qo-' + j);
        b.disabled = true;
        if(o.ok) b.classList.add('quiz-ok');
        else if(j === i) b.classList.add('quiz-no');
    });
    const resDom = document.getElementById('resultText');
    if(opts[i].ok){
        markRight(w);
        resDom.className = 'result right';
        resDom.innerText = `✅ 正确！${w.en}${w.pos ? ' (' + w.pos + ')' : ''} —— ${w.cn}`;
    }else{
        markWrong(w);
        resDom.className = 'result wrong';
        resDom.innerText = `❌ 正确答案：${w.pos ? w.pos + ' ' : ''}${targetOf(w)}`;
    }
    saveData();
    recordStat(opts[i].ok);
    setTimeout(nextWord, 1100);
}

// ================= 朗读 =================
function speak(en){
    try{
        const u = new SpeechSynthesisUtterance(en);
        u.lang = 'en-US';
        u.rate = 0.9;
        const v = speechSynthesis.getVoices().find(x => x.lang.toLowerCase().startsWith('en'));
        if(v) u.voice = v;
        speechSynthesis.speak(u);
    }catch(e){}
}

function speakWord(){ if(currentWord) speak(currentWord.en); }
function speakIdx(i){ speak(wordList[i].en); }

// ================= 同义词归类 =================
function keysOf(w){
    return (w.cn || '').split(/[；;、，,。．.\s]+/).map(s => s.trim()).filter(Boolean);
}

function related(a, b){
    if(a === b) return true;
    return a.length >= 2 && b.length >= 2 && (a.includes(b) || b.includes(a));
}

function buildClusters(){
    const n = wordList.length;
    const parent = Array.from({length:n}, (_, i) => i);
    const find = x => { while(parent[x] !== x){ parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
    const union = (a, b) => { parent[find(a)] = find(b); };
    const keys = wordList.map(keysOf);
    for(let i = 0; i < n; i++){
        for(let j = i + 1; j < n; j++){
            if(keys[i].some(a => keys[j].some(b => related(a, b)))) union(i, j);
        }
    }
    const map = {};
    wordList.forEach((w, i) => { const r = find(i); (map[r] = map[r] || []).push(w); });
    return Object.values(map);
}

function groupLabel(words){
    const freq = {};
    words.forEach(w => keysOf(w).forEach(k => freq[k] = (freq[k] || 0) + 1));
    let best = '';
    for(const k in freq){
        if(!best || freq[k] > freq[best] || (freq[k] === freq[best] && k.length < best.length)) best = k;
    }
    return best;
}

function sameGroup(w){
    return buildClusters().find(g => g.includes(w)) || [];
}

function renderClusters(){
    const list = document.getElementById('clsList');
    const cnt = document.getElementById('clsCount');
    const clusters = buildClusters();
    const groups = clusters.filter(g => g.length > 1);
    const singles = clusters.length - groups.length;
    cnt.innerText = groups.length ? `（发现 ${groups.length} 组同义词，${singles} 个独立词）` : '（暂未发现同义词组）';
    if(!groups.length){
        list.innerHTML = '<div class="none">词库里还没有同义词，导入更多单词后会自动归类</div>';
        return;
    }
    list.innerHTML = groups.map((g, i) => `
        <div class="cls-card">
            <div class="cls-tags">📌 共同意思：${esc(groupLabel(g))}</div>
            <div id="cls-chips-${i}">
                ${g.map((w, j) => `<button class="cls-chip" onclick="toggleClsCard(${i},${j})">${esc(w.en)}</button>`).join('')}
            </div>
            <div class="cls-body" id="cls-body-${i}" style="display:none">
                ${g.map(w => `<div class="cls-word">${esc(w.en)}<span class="cls-cn">${esc([w.pos, w.cn].filter(Boolean).join(' '))}</span></div>`).join('')}
            </div>
        </div>`).join('');
}

function toggleClsCard(i, j){
    const body = document.getElementById(`cls-body-${i}`);
    const open = body.style.display === 'block';
    body.style.display = open ? 'none' : 'block';
    document.querySelectorAll(`#cls-chips-${i} .cls-chip`).forEach((c, k) => c.classList.toggle('cls-chip-on', !open && k === j));
}

function toggleSync(){
    const box = document.getElementById('syncBox');
    const w = currentWord;
    if(!w) return;
    if(box.style.display === 'block'){ box.style.display = 'none'; return; }
    const sibs = sameGroup(w).filter(x => x !== w);
    box.innerHTML = sibs.length
        ? `<h4>🔗 与「${esc(w.en)}」同义的单词</h4>` + sibs.map(x => `<div class="cls-word">${esc(x.en)}<span class="cls-cn">${esc([x.pos, x.cn].filter(Boolean).join(' '))}</span></div>`).join('')
        : '<div class="none">暂未找到同义词</div>';
    box.style.display = 'block';
}

// ================= 单词本 =================
function renderBook(){
    const kw = (document.getElementById('bkSearch').value || '').trim().toLowerCase();
    const el = document.getElementById('bkList');
    document.getElementById('bkCount').innerText = wordList.length;
    const rows = [];
    wordList.forEach((w, i) => {
        if(kw && !w.en.toLowerCase().includes(kw) && !w.cn.includes(kw)) return;
        const lv = w.level || 0;
        const lvName = ['未掌握', '学习中', '已掌握'][lv];
        rows.push(`<div class="bk-row">
            <button class="btn-gray" style="margin:0;padding:4px 10px" onclick="speakIdx(${i})">🔊</button>
            <span class="bk-en">${esc(w.en)}</span>
            <span class="bk-pos">${esc(w.pos || '')}</span>
            <span class="bk-ph">${esc(w.ph || '')}</span>
            <span class="bk-cn">${esc(w.cn)}</span>
            <span class="bk-level lv${lv}" title="连续答对 3 次升为已掌握">${lvName}</span>
        </div>`);
    });
    el.innerHTML = rows.length ? rows.join('') : '<div class="none">没有匹配的单词</div>';
}

// ================= 统计与打卡 =================
function recordStat(ok){
    const t = todayStr();
    const stats = getStats();
    let day = stats.find(s => s.d === t);
    if(!day){ day = {d:t, total:0, right:0, wrong:0}; stats.push(day); }
    day.total++;
    if(ok) day.right++; else day.wrong++;
    saveStats(stats);
    const ci = getCheckin();
    if(!ci.includes(t)){ ci.push(t); saveCheckin(ci); }
    renderTodayLine();
}

function streakDays(){
    const set = new Set(getCheckin());
    const d = new Date();
    if(!set.has(todayStrFrom(d))) d.setDate(d.getDate() - 1);
    let n = 0;
    while(set.has(todayStrFrom(d))){ n++; d.setDate(d.getDate() - 1); }
    return n;
}

function renderTodayLine(){
    const stats = getStats();
    const day = stats.find(s => s.d === todayStr());
    document.getElementById('todayLine').innerText = day
        ? `今日：已练 ${day.total} 词 · 对 ${day.right} · 错 ${day.wrong} · 正确率 ${Math.round(day.right / day.total * 100)}%`
        : '今日：还没开始练习，加油！';
    document.getElementById('statToday').innerHTML = `
        <div class="stat"><b>${day ? day.total : 0}</b><span>今日练习</span></div>
        <div class="stat"><b style="color:#34d399">${day ? day.right : 0}</b><span>答对</span></div>
        <div class="stat"><b style="color:#f87171">${day ? day.wrong : 0}</b><span>答错</span></div>
        <div class="stat"><b>${day && day.total ? Math.round(day.right / day.total * 100) : 0}%</b><span>今日正确率</span></div>`;
}

function renderHeat(){
    const el = document.getElementById('heatMap');
    const map = {};
    getStats().forEach(s => map[s.d] = s);
    const cells = [];
    const d = new Date();
    for(let i = 29; i >= 0; i--){
        const dt = new Date(d);
        dt.setDate(d.getDate() - i);
        const key = todayStrFrom(dt);
        const s = map[key];
        let cls = '', tip = key;
        if(s){
            const acc = Math.round(s.right / s.total * 100);
            cls = acc >= 80 ? 'd3' : (acc >= 50 ? 'd0' : (acc >= 20 ? 'd1' : 'd2'));
            tip = `${key}：${s.total} 词，正确率 ${acc}%`;
        }
        cells.push(`<div class="day ${cls}" title="${tip}">${dt.getDate()}</div>`);
    }
    el.innerHTML = cells.join('');
}

function renderMastery(){
    const n = wordList.length;
    const lv = [0, 0, 0];
    wordList.forEach(w => lv[w.level || 0]++);
    const pct = i => n ? Math.round(lv[i] / n * 100) : 0;
    const bar = document.getElementById('lvBar');
    const parts = [];
    if(lv[0]) parts.push(`<div style="background:#ef4444;width:${pct(0)}%">${pct(0)}%</div>`);
    if(lv[1]) parts.push(`<div style="background:#f59e0b;width:${pct(1)}%">${pct(1)}%</div>`);
    if(lv[2]) parts.push(`<div style="background:#10b981;width:${pct(2)}%">${pct(2)}%</div>`);
    if(!parts.length) parts.push('<div class="none" style="width:100%">暂无数据</div>');
    bar.innerHTML = parts.join('');
    document.getElementById('lvCount').innerText = n;
    document.getElementById('lvLegend').innerHTML = `
        <div class="stat"><b style="color:#ef4444">${lv[0]}</b><span>未掌握</span></div>
        <div class="stat"><b style="color:#f59e0b">${lv[1]}</b><span>学习中</span></div>
        <div class="stat"><b style="color:#10b981">${lv[2]}</b><span>已掌握</span></div>`;
}

function renderStatViews(){
    renderTodayLine();
    document.getElementById('streakNum').innerText = streakDays();
    renderHeat();
    renderMastery();
}

// ================= 初始化 =================
saveData();
renderTodayLine();
resetPool();
</script>
